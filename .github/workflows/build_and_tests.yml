name: build_and_test

'on':
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' || !github.ref }}

jobs:
  build:
    strategy:
      # падение одной конфигурации не отменяет остальные
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        # C-компилятор нужен зависимостям на C (AWS-LC), иначе они собираются системным cc
        compiler:
          - { cxx: g++-13, c: gcc-13 }
          - { cxx: clang++-18, c: clang-18 }
        cpp_standard: [20]
        build_type: [Debug, Release]
    runs-on: ${{matrix.os}}
    env:
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          # обе конфигурации (с санитайзерами и без) берут зависимости CPM из одной папки
          echo "CPM_SOURCE_CACHE=${{ runner.temp }}/cpm-cache" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y ninja-build
          if [[ "${{ matrix.compiler.cxx }}" == g++-13* ]]; then
            sudo apt-get install -y gcc-13 g++-13
          elif [[ "${{ matrix.compiler.cxx }}" == clang++-18* ]]; then
            sudo apt-get install -y clang-18
          fi
      - name: Install h2spec
        run: |
          wget https://github.com/summerwind/h2spec/releases/download/v2.6.0/h2spec_linux_amd64.tar.gz
          tar -xzf h2spec_linux_amd64.tar.gz
          sudo mv h2spec /usr/local/bin/

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        with:
          version: "v0.10.0" # Version of the sccache binary to install
      - name: Configure CMake sanitizers
        run: |
          cmake . -DHIDI_ENABLE_TESTING=ON            \
            -DCMAKE_BUILD_TYPE=${{matrix.build_type}}     \
            -DCMAKE_CXX_COMPILER=${{matrix.compiler.cxx}} \
            -DCMAKE_C_COMPILER=${{matrix.compiler.c}}     \
            -DCMAKE_CXX_STANDARD=${{matrix.cpp_standard}} \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5            \
            -DHIDI_ENABLE_SANITIZERS=ON               \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache           \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache         \
            -B build_sanitizers -G "Ninja"

      - name: Build sanitizers
        run: |
          cmake --build build_sanitizers

      - name: Test sanitizers
        run: |
          cd build_sanitizers
          ctest --output-on-failure -C ${{matrix.build_type}}

      - name: Configure CMake
        run: |
          cmake . -DHIDI_ENABLE_TESTING=ON               \
            -DCMAKE_BUILD_TYPE=${{matrix.build_type}}     \
            -DCMAKE_CXX_COMPILER=${{matrix.compiler.cxx}} \
            -DCMAKE_C_COMPILER=${{matrix.compiler.c}}     \
            -DCMAKE_CXX_STANDARD=${{matrix.cpp_standard}} \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5            \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache           \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache         \
            -B build -G "Ninja"

      - name: Build
        run: |
          cmake --build build

      - name: Test
        run: |
          cd build
          ctest --output-on-failure -C ${{matrix.build_type}}

